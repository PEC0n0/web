<main class="studio-main" id="main">
<header class="studio-heading site-width">
<div>
<p class="eyebrow">A CANVAS WE SHARE
</p>
<h1>一起，添一点颜色。
</h1>
</div>
<p>48 × 48 的小小世界，<br/>每一格都是一次相遇。
</p>
</header>
<div class="studio-shell site-width">
<section aria-label="共享像素画布" class="studio-stage">
<div class="studio-stage-top"><span class="stage-name"><svg aria-hidden="true" viewbox="0 0 20 20"><rect height="14" rx="3" width="14" x="3" y="3"></rect><path d="M3 10h14M10 3v14"></path></svg>共创画布</span><time class="time-display" id="currentTime">正在校准时间…</time><span class="pending-count" id="pendingCount" role="status">待同步: 0</span>
</div>
<div aria-label="画布区域，开启绘画模式后可以落笔" id="viewport">
<div id="canvasContainer">
</div>
</div>
<div class="stage-zoom"><span>给想象力，留一格位置。</span>
<div class="zoom-buttons"><button aria-label="缩小画布" onclick="zoomCanvas(.85)" type="button">−</button><button aria-label="放大画布" onclick="zoomCanvas(1.18)" type="button">+</button><button onclick="resetCanvasView()" type="button">适合窗口</button>
</div>
</div>
</section>
<aside aria-label="绘画工具" class="controls">
<section class="mode-switch">
<p class="tool-heading">01 / DRAWING MODE
</p>
<label class="draw-toggle" for="drawModeToggle">绘画模式<input id="drawModeToggle" role="switch" type="checkbox"/></label>
<p class="mode-help" id="modeHint">拖动画布，滚轮或双指缩放。
</p>
</section>
<div class="studio-rule">
</div>
<section class="palette-section">
<p class="tool-heading">02 / PICK A COLOR
</p>
<div aria-label="调色板" class="palette" id="palette">
</div>
</section>
<div class="studio-rule">
</div>
<div class="btn-group"><button class="button sync-btn" id="syncBtn" onclick="syncData()" type="button"><svg aria-hidden="true" viewbox="0 0 20 20"><path d="M16 7A6.5 6.5 0 1 0 16 13M16 3v4h-4"></path></svg><span><span class="wide-label">上传并</span>同步</span></button><button class="button secondary save-btn" id="saveBtn" onclick="savePixelArt()" type="button"><svg aria-hidden="true" viewbox="0 0 20 20"><path d="M10 3v10m-4-4 4 4 4-4M3 14v3h14v-3"></path></svg>保存图片</button>
</div>
<p class="canvas-note"><strong>一起画，也请一起爱护。</strong>这是大家共享的画布。完成后点击同步，把你的颜色留给下一位路过的人。
</p>
</aside>
</div>

</div>
