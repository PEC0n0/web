<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#faf8f6">
  <meta name="description" content="Peco 的私人聊天空间">
  <title>私人聊天 · Peco</title>
  <link rel="stylesheet" href="/chat/chat.css">
  <script type="module" src="/chat/chat.js"></script>
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m6 12 6-6 6 6M12 6v13"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-1 1V11.5a8.5 8.5 0 0 1 17 0Z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-exit" viewBox="0 0 24 24"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M9 12h12m-5-5 5 5-5 5"/></symbol>
  </svg>

  <main id="login-view" class="login-view">
    <a class="wordmark login-brand" href="/">peco<span>.</span></a>
    <div class="login-card">
      <div class="lock-emblem"><svg><use href="#i-lock"/></svg></div>
      <p class="eyebrow">YOUR PRIVATE CORNER</p>
      <h1>灵感，随时接着聊。</h1>
      <p class="login-description">一个只属于你的空间。<br>输入密码，连接电脑上的对话。</p>
      <form id="login-form">
        <label for="password">访问密码</label>
        <div class="password-field">
          <input id="password" name="password" type="password" placeholder="请输入你的密码" autocomplete="current-password" required maxlength="256">
          <button id="toggle-password" type="button" class="icon-button" aria-label="显示密码" aria-pressed="false"><svg><use href="#i-eye"/></svg></button>
        </div>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button id="login-submit" class="primary login-submit" type="submit">进入私人聊天 <span aria-hidden="true">↗</span></button>
      </form>
      <div class="private-note"><svg><use href="#i-lock"/></svg> 密码验证后，才能查看对话和图片</div>
    </div>
    <footer class="login-footer"><a href="/">返回 peco.ink</a><span>一点灵感，一点自己的时间。</span></footer>
  </main>

  <div id="app-view" class="app" hidden>
    <button id="drawer-backdrop" class="drawer-backdrop" aria-label="关闭对话列表" hidden></button>
    <aside id="sidebar" class="sidebar" aria-label="对话列表">
      <div class="sidebar-brand"><a class="wordmark" href="/">peco<span>.</span></a><span class="private-tag"><svg><use href="#i-lock"/></svg>私人空间</span><button id="close-drawer" class="icon-button mobile-only" aria-label="关闭对话列表"><svg><use href="#i-close"/></svg></button></div>
      <button id="new-chat" class="new-chat"><svg><use href="#i-plus"/></svg>开启新对话<span>↗</span></button>
      <label class="search-label" for="thread-search">电脑上的对话</label>
      <input id="thread-search" class="thread-search" type="search" placeholder="搜索对话…" autocomplete="off" maxlength="100">
      <nav id="thread-list" class="thread-list" aria-label="最近的对话"></nav>
      <button id="more-threads" class="text-button more-threads" hidden>更多对话</button>
      <div class="sidebar-footer"><div class="owner-avatar">P</div><div><strong>Peco</strong><span>自己的小小工作台</span></div><button id="logout" class="icon-button" aria-label="退出并锁定"><svg><use href="#i-exit"/></svg></button></div>
    </aside>

    <main class="chat-main">
      <header class="chat-header">
        <button id="open-drawer" class="icon-button mobile-only" aria-label="打开对话列表"><svg><use href="#i-menu"/></svg></button>
        <div class="header-title"><span class="eyebrow">PRIVATE CHAT</span><h1 id="chat-title">私人聊天</h1></div>
        <button id="connection" class="connection" title="检查电脑连接"><span id="connection-dot" class="status-dot"></span><span id="connection-label">连接电脑中</span></button>
      </header>
      <div id="notice" class="notice" role="status" hidden></div>

      <section id="conversation" class="conversation" aria-label="聊天内容" tabindex="0">
        <div id="welcome" class="welcome">
          <div class="welcome-mark" aria-hidden="true">p<span>.</span></div>
          <p class="eyebrow">A LITTLE SPACE FOR BIG IDEAS</p>
          <h2>今天，有什么新想法？</h2>
          <p>聊一聊，画张图，或接着上次的灵感往下走。</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="帮我把这个想法整理清楚：" data-mode="chat"><svg><use href="#i-chat"/></svg><strong>一起想一想</strong><span>把零散的灵感，慢慢理清</span><b aria-hidden="true">↗</b></button>
            <button class="suggestion" data-prompt="画一张温暖、简洁的插画：" data-mode="image"><svg><use href="#i-image"/></svg><strong>画出脑海里的画面</strong><span>描述画面，也可以加张参考图</span><b aria-hidden="true">↗</b></button>
          </div>
        </div>
        <button id="older-messages" class="text-button older-messages" hidden>加载更早的消息</button>
        <div id="messages" class="messages"></div>
        <div id="approvals" class="approvals"></div>
      </section>

      <div class="composer-area">
        <p id="activity" class="activity" role="status" hidden></p>
        <form id="composer-form" class="composer">
          <div id="attachments" class="attachments" aria-label="已选参考图"></div>
          <label class="sr-only" for="message">发送消息</label>
          <textarea id="message" placeholder="写下你的想法…" rows="1" maxlength="30000"></textarea>
          <div class="composer-tools">
            <div class="composer-left"><button id="attach" class="icon-button" type="button" aria-label="上传参考图" title="上传参考图（最多 4 张，每张 12 MB）"><svg><use href="#i-plus"/></svg></button><input id="file-input" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
              <div class="mode-switch" aria-label="聊天模式"><button id="mode-chat" class="mode active" type="button" aria-pressed="true">聊天</button><button id="mode-image" class="mode" type="button" aria-pressed="false"><svg><use href="#i-image"/></svg>绘图</button></div>
              <label class="sr-only" for="model">选择模型</label><select id="model" aria-label="选择模型"><option value="">电脑默认模型</option></select>
            </div>
            <button id="stop" class="stop-button" type="button" aria-label="停止回复" hidden><span></span></button>
            <button id="send" class="send-button" type="submit" aria-label="发送消息"><svg><use href="#i-arrow"/></svg></button>
          </div>
        </form>
        <p class="composer-note">对话在你的电脑上继续 · 生成图片后可下载原图</p>
      </div>
    </main>
  </div>

  <dialog id="image-viewer" class="image-viewer"><button id="close-image" class="icon-button" aria-label="关闭图片"><svg><use href="#i-close"/></svg></button><img id="full-image" alt="图片原图"><a id="download-image" class="primary" download>下载原图 ↓</a></dialog>
</body>
</html>
