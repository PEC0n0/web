<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>广告位招租 - peco</title>
    <meta name="theme-color" content="#ff6b6b" />
    <link rel="icon" href="https://peco.ink/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
    <style>
      .page-content {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px 80px;
        text-align: center;
      }
      .big-text {
        font-size: 2.5rem;
        font-weight: 800;
        margin: 0 0 10px;
        background: linear-gradient(
          135deg,
          var(--color-primary),
          var(--color-warm)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .sub-text {
        font-size: 1.1rem;
        color: var(--color-text-muted);
        margin-bottom: 30px;
      }
      .friends-section {
        max-width: 500px;
        width: 100%;
      }
      .friend-card {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 20px;
        background: var(--color-card);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        margin-bottom: 12px;
        transition: transform var(--transition-normal),
          background var(--transition-normal),
          box-shadow var(--transition-normal);
        cursor: default;
      }
      .friend-card:hover {
        transform: translateY(-2px);
        background: var(--color-card-hover);
        box-shadow: 0 8px 24px var(--color-shadow);
      }
      .friend-avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
      }
      .friend-info {
        flex: 1;
        text-align: left;
      }
      .friend-name {
        font-weight: 700;
        font-size: 1rem;
        color: var(--color-text);
        margin: 0;
      }
      .friend-desc {
        font-size: 0.8rem;
        color: var(--color-text-muted);
        margin: 2px 0 0;
      }
      .friend-link {
        color: var(--color-primary);
        font-size: 0.8rem;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 20px;
        border: 1px solid rgba(255, 107, 107, 0.2);
        transition: background var(--transition-fast),
          color var(--transition-fast), border-color var(--transition-fast);
        text-decoration: none;
        white-space: nowrap;
      }
      .friend-link:hover {
        background: var(--color-primary);
        color: white;
        border-color: var(--color-primary);
      }
      @media (max-width: 600px) {
        .big-text {
          font-size: 1.8rem;
        }
        .friend-card {
          padding: 12px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-transition" id="pageTransition"></div>

    <div class="page-content">
      <h1 class="big-text fade-in">Oops！</h1>
      <p class="sub-text fade-in fade-in-delay-1">这里还没有友情链接呢</p>

      <!-- Profile Card -->
      <div class="fade-in fade-in-delay-2 reveal" style="margin-bottom: 24px">
        <div
          class="glass-card"
          style="
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            max-width: 400px;
            margin: 0 auto;
          "
        >
          <a href="3.html" class="avatar-wrapper" style="flex-shrink: 0">
            <img src="2.jpg" alt="peco" width="64" height="64" loading="lazy" />
          </a>
          <div style="flex: 1; text-align: left">
            <p style="margin: 0; font-weight: 700; font-size: 1rem">
              小熊猫 peco
            </p>
            <p
              style="
                margin: 2px 0 0;
                font-size: 0.8rem;
                color: var(--color-text-muted);
              "
            >
              🐾 在竹林中写代码
            </p>
          </div>
        </div>
      </div>

      <!-- Friends Placeholder -->
      <div class="friends-section">
        <p
          class="reveal"
          style="
            color: var(--color-text-muted);
            font-size: 0.9rem;
            margin-bottom: 16px;
          "
        >
          💭 未来可能会有...
        </p>
      </div>
    </div>

    <!-- Bottom Bar -->
    <nav class="bottom-bar">
      <p>🦝 友情链接</p>
      <a href="javascript:void(0)" onclick="navigateTo('index.html')"
        >回到主页</a
      >
      <span class="divider">|</span>
      <a href="javascript:void(0)" onclick="navigateTo('3.html')">留言板</a>
    </nav>

    <script src="script.js"></script>
  </body>
</html>
